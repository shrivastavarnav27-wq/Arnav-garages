<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About | Arnav Garages</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0b0b0b;
color:white;
overflow-x:hidden;
}

header{
background:rgba(0,0,0,0.9);
padding:20px 8%;
position:sticky;
top:0;
z-index:1000;
backdrop-filter:blur(10px);
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:2rem;
font-weight:800;
color:#ff3131;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
transition:.3s;
}

nav a:hover{
color:#ff3131;
}

.hero{
height:70vh;
background:
linear-gradient(rgba(0,0,0,.65),
rgba(0,0,0,.75)),
url("https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:5rem;
color:#ff3131;
}

.hero p{
font-size:1.2rem;
margin-top:15px;
}

.about-section{
padding:80px 10%;
}

.about-container{
display:grid;
grid-template-columns:1fr 2fr;
gap:50px;
align-items:center;
}

.profile img{
width:100%;
max-width:350px;
border-radius:25px;
border:4px solid #ff3131;
}

.about-content h2{
font-size:3rem;
color:#ff3131;
margin-bottom:20px;
}

.about-content p{
line-height:1.8;
color:#ddd;
}

.stats{
padding:80px 10%;
display:flex;
justify-content:center;
gap:60px;
flex-wrap:wrap;
text-align:center;
}

.stat-box
