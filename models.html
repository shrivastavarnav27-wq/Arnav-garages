<style>

*{
    margin:0;

body{

header{

.models{

.model-card{

    overflow:hidden;
    transition:.4s;
}

.model-card:hover{
    box-shadow:0 0 25px rgba(255,49,49,.4);

model-viewer{
    width:100%;

.content{

.download{
